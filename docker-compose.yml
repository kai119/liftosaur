services:
  dynamo:
    image: scylladb/scylla:2026.2.5
    container_name: liftosaur-dynamo
    command: >
      --smp 1
      --memory 750M
      --overprovisioned 1
      --developer-mode 1
      --alternator-port 8000
      --alternator-write-isolation always
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamo-data:/var/lib/scylla

  s3:
    image: chrislusf/seaweedfs:4.44
    container_name: liftosaur-s3
    command: >
      server
      -dir=/data
      -filer
      -s3
      -s3.config=/etc/seaweedfs/s3.json
      -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  dynamo-data:
  s3-data:
